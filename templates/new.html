<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Audiobook</title>
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
    <link rel="apple-touch-icon" href="/static/icon-192x192.png">
    <script src="/static/theme.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --text-light: #555555;
            --border-color: #cccccc;
            --border-light: #eeeeee;
            --card-bg: #f9f9f9;
            --result-hover: #f0f8ff;
            --input-bg: #ffffff;
            --input-text: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --text-light: #888888;
            --border-color: #444444;
            --border-light: #333333;
            --card-bg: #1e1e1e;
            --result-hover: #2a2a2a;
            --input-bg: #2a2a2a;
            --input-text: #e0e0e0;
        }

        body { font-family: sans-serif; margin: 2rem; background-color: var(--bg-color); color: var(--text-color); }
        h1, h3 { color: var(--text-color); }
        .form-group { margin-bottom: 15px; }
        input[type="text"], input[type="file"], select { padding: 8px; width: 300px; background-color: var(--input-bg); color: var(--input-text); border: 1px solid var(--border-color); }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; }

        .search-section { border: 1px solid var(--border-color); padding: 15px; border-radius: 5px; background: var(--card-bg); margin-bottom: 20px; max-width: 600px;}
        .search-results { max-height: 300px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border-light); background: var(--bg-color); }
        .result-item { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-light); cursor: pointer; }
        .result-item:hover { background: var(--result-hover); }
        .result-thumbnail { width: 50px; height: 75px; background: var(--border-color); object-fit: cover; }
        .result-details { flex: 1; }
        .result-title { font-weight: bold; }
        .result-author { font-size: 0.9em; color: var(--text-light); }
        .loading { display: none; margin-top: 10px; color: #007bff; font-weight: bold; }
        .no-results { padding: 10px; color: #d9534f; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; max-width: 600px; margin-bottom: 20px;">
        <div>
            <a href="/" class="back-link">&larr; Back to Library</a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="/static/logo.png" alt="DigiBook Logo" style="height: 50px; width: auto; object-fit: contain;">
                <h1 style="margin: 0;">Start New Audiobook</h1>
            </div>
        </div>
        <button class="btn theme-toggle-btn" style="background: none; border: 1px solid var(--border-color); color: var(--text-color);">🌓 Theme</button>
    </div>

    <div class="search-section">
        <h3>Search & Select Edition</h3>
        <p style="font-size: 0.9em; color: var(--text-muted);">Search Open Library to automatically fill metadata fields.</p>
        <input type="text" id="search_input" placeholder="Search by title..." style="width: 100%; box-sizing: border-box;">
        <div id="search_loading" class="loading">Searching...</div>
        <div id="search_results" class="search-results"></div>
    </div>

    <form action="/new" method="POST">
        <input type="hidden" id="author" name="author" value="">
        <input type="hidden" id="year" name="year" value="">
        <input type="hidden" id="cover_url" name="cover_url" value="">
        <input type="hidden" id="isbn" name="isbn" value="">
        <input type="hidden" id="description" name="description" value="">

        <div class="form-group">
            <label for="book_name">Audiobook Name:</label><br>
            <input type="text" id="book_name" name="book_name" required>
        </div>
        <div class="form-group">
            <label for="cd_drive">CD Drive Path (Optional):</label><br>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="cd_drive" name="cd_drive">
                <button type="button" id="browse_btn" class="btn" style="background: #6c757d; padding: 8px 12px;">Browse...</button>
            </div>
        </div>
        <button type="submit" class="btn">Start Ripping</button>
    </form>

    <div class="search-section" style="margin-top: 20px;">
        <h3>Upload Existing Files</h3>
        <p style="font-size: 0.9em; color: var(--text-muted);">Upload multiple audio files or a directory directly to merge them.</p>
        <form id="upload_form">
            <div class="form-group">
                <label for="upload_files">Select Files or Folder:</label><br>
                <input type="file" id="upload_files" name="files" multiple webkitdirectory>
            </div>
            <div class="form-group">
                <label for="upload_output_format">Merge Format:</label><br>
                <select id="upload_output_format" name="output_format" style="padding: 8px; border-radius: 5px;">
                    <option value=".mp3" selected>Merge to MP3</option>
                    <option value=".m4b">Merge to M4B (Audiobook)</option>
                </select>
            </div>
            <button type="button" id="upload_btn" class="btn" style="background: #17a2b8;">Upload & Merge</button>
            <div id="upload_status" style="margin-top: 10px; font-weight: bold;"></div>
        </form>
    </div>

    <script>
        const searchInput = document.getElementById('search_input');
        const searchResults = document.getElementById('search_results');
        const searchLoading = document.getElementById('search_loading');

        let searchTimeout = null;
        const searchCache = new Map();

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (searchTimeout) clearTimeout(searchTimeout);

            if (query.length < 2) {
                searchResults.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 400); // 400ms debounce
        });

        async function performSearch(query) {
            if (searchCache.has(query)) {
                renderResults(searchCache.get(query));
                return;
            }

            searchLoading.style.display = 'block';
            searchResults.innerHTML = '';

            try {
                const response = await fetch(`/api/search_metadata?title=${encodeURIComponent(query)}`);
                const data = await response.json();
                searchCache.set(query, data);
                renderResults(data);
            } catch (error) {
                console.error("Error searching:", error);
                searchResults.innerHTML = '<div class="no-results">Error fetching results.</div>';
            } finally {
                searchLoading.style.display = 'none';
            }
        }

        function renderResults(results) {
            searchResults.innerHTML = '';
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="no-results">No results found - enter manually</div>';
                return;
            }

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'result-item';

                const img = document.createElement('img');
                img.className = 'result-thumbnail';
                if (result.cover_url) {
                    img.src = result.cover_url;
                }

                const details = document.createElement('div');
                details.className = 'result-details';

                const title = document.createElement('div');
                title.className = 'result-title';
                title.textContent = result.title;

                const authorYear = document.createElement('div');
                authorYear.className = 'result-author';
                authorYear.textContent = `${result.author} ${result.year ? '(' + result.year + ')' : ''}`;

                details.appendChild(title);
                details.appendChild(authorYear);

                item.appendChild(img);
                item.appendChild(details);

                item.addEventListener('click', () => selectResult(result));
                searchResults.appendChild(item);
            });
        }

        async function selectResult(result) {
            document.getElementById('book_name').value = result.title;
            document.getElementById('author').value = result.author;
            document.getElementById('year').value = result.year;
            document.getElementById('isbn').value = result.isbn;
            document.getElementById('cover_url').value = result.cover_url_large;

            // Optional: visual feedback that a book was selected, e.g. clear search
            searchInput.value = result.title;
            searchResults.innerHTML = '';

            if (result.work_id) {
                try {
                    const response = await fetch(`/api/work_description?work_id=${encodeURIComponent(result.work_id)}`);
                    const data = await response.json();
                    document.getElementById('description').value = data.description || '';
                } catch (error) {
                    console.error("Error fetching description:", error);
                    document.getElementById('description').value = '';
                }
            } else {
                document.getElementById('description').value = '';
            }
        }

        document.getElementById('browse_btn').addEventListener('click', async () => {
            const btn = document.getElementById('browse_btn');
            const input = document.getElementById('cd_drive');
            btn.disabled = true;
            btn.innerText = "Browsing...";
            try {
                const response = await fetch('/select_drive');
                if (response.ok) {
                    const data = await response.json();
                    if (data.path) {
                        input.value = data.path;
                    }
                } else {
                    console.error("Error fetching drive path.");
                }
            } catch (error) {
                console.error("Fetch error:", error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Browse...";
            }
        });

        document.getElementById('upload_btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('upload_files');
            const bookName = document.getElementById('book_name').value.trim();
            const statusDiv = document.getElementById('upload_status');

            if (!bookName) {
                statusDiv.innerText = "Please enter an Audiobook Name above.";
                statusDiv.style.color = "red";
                return;
            }

            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Please select files or a directory.";
                statusDiv.style.color = "red";
                return;
            }

            const formData = new FormData();
            formData.append('book_name', bookName);
            formData.append('author', document.getElementById('author').value);
            formData.append('year', document.getElementById('year').value);
            formData.append('cover_url', document.getElementById('cover_url').value);
            formData.append('isbn', document.getElementById('isbn').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('output_format', document.getElementById('upload_output_format').value);

            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            const btn = document.getElementById('upload_btn');
            btn.disabled = true;
            btn.innerText = "Uploading & Merging...";
            statusDiv.innerText = "Processing... this may take a few minutes.";
            statusDiv.style.color = "blue";

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    statusDiv.innerText = "Success! Redirecting...";
                    statusDiv.style.color = "green";
                    window.location.href = data.redirect_url;
                } else {
                    statusDiv.innerText = "Error: " + (data.message || "Unknown error");
                    statusDiv.style.color = "red";
                    btn.disabled = false;
                    btn.innerText = "Upload & Merge";
                }
            } catch (error) {
                console.error("Upload error:", error);
                statusDiv.innerText = "Error during upload. See console.";
                statusDiv.style.color = "red";
                btn.disabled = false;
                btn.innerText = "Upload & Merge";
            }
        });
    </script>
</body>
</html>
