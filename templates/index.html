<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/theme.js"></script>
    <title>Audiobook Digitizer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --text-muted: #555555;
            --text-light: #777777;
            --border-color: #cccccc;
            --border-light: #dddddd;
            --border-lighter: #eeeeee;
            --card-bg: #f9f9f9;
            --header-bg: #eeeeee;
            --cover-bg: #e0e0e0;
            --cover-text: #888888;
            --input-bg: #ffffff;
            --input-text: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --text-light: #888888;
            --border-color: #444444;
            --border-light: #555555;
            --border-lighter: #333333;
            --card-bg: #1e1e1e;
            --header-bg: #2a2a2a;
            --cover-bg: #333333;
            --cover-text: #777777;
            --input-bg: #2a2a2a;
            --input-text: #e0e0e0;
        }

        body { font-family: sans-serif; margin: 2rem; background-color: var(--bg-color); color: var(--text-color); }
        h1 { color: var(--text-color); }
        .library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .book {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            background: var(--card-bg);
        }
        .book-cover-link {
            text-decoration: none;
            color: inherit;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .book-cover {
            background: var(--cover-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--cover-text);
        }
        .book-title {
            padding: 10px;
            font-size: 0.9rem;
            word-break: break-word;
            font-weight: bold;
        }
        .book-actions {
            display: flex;
            padding: 10px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-light);
            gap: 10px;
        }
        .delete-form {
            flex: 1;
        }
        .btn { padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #0056b3; }
        .btn-edit {
            background: #28a745;
            padding: 5px 10px;
            font-size: 0.8rem;
            flex: 1;
            text-align: center;
        }
        .btn-edit:hover {
            background: #218838;
        }
        .btn-delete {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 0.8rem;
            width: 100%;
        }
        .btn-delete:hover {
            background: #c82333;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sort-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .admin-only {
                display: none !important;
            }
        }

        @media (max-width: 360px) {
            body { margin: 1rem; }
            .header-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            .sort-form {
                flex-direction: column;
                align-items: stretch;
            }
            .sort-form label { display: none; }
            .sort-form select { width: 100%; padding: 8px; font-size: 1rem; }
            .btn { text-align: center; width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
        <img src="/static/logo.png" alt="DigiBook Logo" style="height: 50px; width: auto; object-fit: contain;">
        <h1 style="margin: 0;">My Audiobooks</h1>
    </div>

    <div class="header-controls">
        <div style="display: flex; gap: 10px;">
            <a href="/new" class="btn admin-only">New Audiobook</a>
            <button class="btn theme-toggle-btn" style="background: none; border: 1px solid var(--border-color); color: var(--text-color);">🌓 Theme</button>
        </div>

        <form action="/" method="GET" class="sort-form">
            <label for="sort_by">Sort by:</label>
            <select name="sort_by" id="sort_by" onchange="this.form.submit()">
                <option value="date_added" {% if current_sort == 'date_added' %}selected{% endif %}>Date Added</option>
                <option value="title" {% if current_sort == 'title' %}selected{% endif %}>Title</option>
                <option value="author" {% if current_sort == 'author' %}selected{% endif %}>Author</option>
                <option value="year" {% if current_sort == 'year' %}selected{% endif %}>Year</option>
            </select>

            <select name="order" id="order" onchange="this.form.submit()">
                <option value="asc" {% if current_order == 'asc' %}selected{% endif %}>Ascending</option>
                <option value="desc" {% if current_order == 'desc' %}selected{% endif %}>Descending</option>
            </select>

            <noscript>
                <button type="submit" class="btn btn-edit">Sort</button>
            </noscript>
        </form>
    </div>

    <hr>
    <div class="library">
        {% if books %}
            {% for book in books %}
                <div class="book">
                    <a href="/listen/{{ book.filename }}" class="book-cover-link" title="Listen to audiobook">
                        <div class="book-cover">
                            <img src="/cover/{{ book.filename }}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <span style="display: none;">🎵</span>
                        </div>
                        <div class="book-title">
                            {{ book.title }}
                            {% if book.author %}
                                <div style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">{{ book.author }}</div>
                            {% endif %}
                            {% if book.year %}
                                <div style="font-size: 0.7rem; font-weight: normal; color: var(--text-light);">{{ book.year }}</div>
                            {% endif %}
                        </div>
                    </a>
                    <div class="book-progress" data-filename="{{ book.filename }}" style="height: 5px; background: var(--border-light); width: 100%;">
                        <div class="progress-bar" style="height: 100%; width: 0%; background: #28a745; transition: width 0.3s;"></div>
                    </div>
                    <div class="book-actions" style="flex-wrap: wrap;">
                        <a href="/listen/{{ book.filename }}" class="btn btn-edit btn-resume" data-filename="{{ book.filename }}" style="display: none; background-color: #ffc107; color: black; flex-basis: 100%; margin-bottom: 5px;" title="Resume Playback">Resume</a>
                        <a href="/open/{{ book.filename }}" class="btn btn-edit admin-only" style="background-color: #17a2b8;" title="Open Dir">Dir</a>
                        <a href="/metadata/{{ book.filename }}" class="btn btn-edit admin-only">Edit</a>
                        <form action="/delete/{{ book.filename }}" method="POST" class="delete-form admin-only" onsubmit="return confirm('Are you sure you want to delete {{ book.title }}?');" style="flex-basis: 100%;">
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p>No audiobooks in library yet.</p>
        {% endif %}
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            let progressData = {};
            try {
                const response = await fetch('/api/progress_all');
                if (response.ok) {
                    progressData = await response.json();
                }
            } catch (error) {
                console.error('Error fetching progress data:', error);
            }

            const books = document.querySelectorAll('.book');
            books.forEach(bookCard => {
                const progressContainer = bookCard.querySelector('.book-progress');
                if (!progressContainer) return;

                const filename = progressContainer.getAttribute('data-filename');
                const durationKey = `audiobook_duration_${filename}`;

                const position = progressData[filename] || 0;
                const duration = localStorage.getItem(durationKey);

                if (position > 0) {
                    // Show resume button
                    const resumeBtn = bookCard.querySelector('.btn-resume');
                    if (resumeBtn) resumeBtn.style.display = 'block';

                    // Update progress bar
                    if (duration) {
                        const percent = (parseFloat(position) / parseFloat(duration)) * 100;
                        const progressBar = progressContainer.querySelector('.progress-bar');
                        if (progressBar) {
                            progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
